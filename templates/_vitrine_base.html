 <!-- Force SW cache purge and update -->
 <script>
 (function() {
 if (!('serviceWorker' in navigator)) return;
 var SW_VERSION = 'v1.8.0';
 var lastSW = localStorage.getItem('sw-version');
 if (lastSW !== SW_VERSION) {
 caches.keys().then(function(names) {
 return Promise.all(names.map(function(n) { return caches.delete(n); }));
 }).then(function() {
 return navigator.serviceWorker.getRegistration();
 }).then(function(reg) {
 if (reg) return reg.unregister();
 }).then(function() {
 localStorage.setItem('sw-version', SW_VERSION);
 location.reload();
 });
 }
 })();
</script>
